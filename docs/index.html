<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About me</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #2e466b;
    color: #dcdbdb;
    margin: 0;
    padding: 0;
    line-height: 1.6;
}

/* LINKS */
a {
    color: #61dafb;
    text-decoration: none;
}
a:hover {
    text-decoration: underline;
}

/* HEADER */
.banner {
    background-image: linear-gradient(135deg, #2f80ed, #34ace0);
    color: white;
    text-align: center;
    padding: 40px 20px;
}

.banner h1 {
    font-size: 3.5rem;
    margin: 0;
}

/* INTRO */
.greeting {
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
    background-color: #161b22;
    border-radius: 12px;
}

/* SKILLS */
.skills-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
}

.skills-text {
    background-color: #1f2937;
    padding: 25px;
    border-radius: 12px;
}

/* CARD */
.stats-card {
    margin-top: 25px;
    background: #111827;
    border-radius: 14px;
    padding: 18px;
    width: 260px;
    border: 1px solid rgba(97,218,251,0.2);
}

.trophy {
    font-size: 32px;
    text-align: center;
}

.skill-row {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}

.skill-percent {
    color: #61dafb;
}

/* PROGRESS */
.progress-bar {
    width: 100%;
    height: 10px;
    background: #1f2937;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 75%;
    background: linear-gradient(90deg, #61dafb, #34ace0);
}

/* ===== APPLE STYLE LOGO MARQUEE ===== */

.logo-wrapper {
    position: relative;
    overflow: hidden;
    width: 100%;
    margin-top: 30px;
}

.logo-track {
    display: flex;
    width: max-content;
    animation: marquee 18s linear infinite;
}

.logo-set {
    display: flex;
    gap: 40px;
    align-items: center;
}

.small-logo {
    width: 38px;
    opacity: 0.85;
    transition: 0.25s ease;
    flex: 0 0 auto;
}

.small-logo:hover {
    transform: scale(1.25);
    opacity: 1;
}

@keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

/* pause on hover */
.logo-wrapper:hover .logo-track {
    animation-play-state: paused;
}

/* fade edges */
.logo-wrapper::before,
.logo-wrapper::after {
    content: "";
    position: absolute;
    top: 0;
    width: 80px;
    height: 100%;
    z-index: 2;
}

.logo-wrapper::before {
    left: 0;
    background: linear-gradient(to right, #1f2937, transparent);
}

.logo-wrapper::after {
    right: 0;
    background: linear-gradient(to left, #1f2937, transparent);
}

/* BUTTON */
.scroll-top {
    position: fixed;
    right: 20px;
    bottom: 20px;
    padding: 10px 16px;
    background: #61dafb;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* FOOTER */
.footer-pattern {
    background-color: #111517;
    text-align: center;
    padding: 40px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .skills-section {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="banner">
    <h1>LikaLi1</h1>
</div>

<div class="greeting">
    <h2>Hi</h2>
    <p>My name is Beth, IT specialist. Portfolio & experiments 🚀</p>
</div>

<div class="skills-section">

    <div class="skills-text">

        <h3>Skills</h3>
        <ul style="list-style:none; padding:0;">
            <li>HTML / CSS / JS</li>
            <li>Python</li>
            <li>UI/UX Design</li>
        </ul>

        <h3>Projects</h3>
        <ul style="list-style:none; padding:0;">
            <li><a href="#">Project 1</a></li>
            <li><a href="#">Project 2</a></li>
        </ul>

        <!-- CARD -->
        <div class="stats-card">
            <div class="trophy">🏆</div>

            <div class="skill-row">
                <span>C++</span>
                <span class="skill-percent">75%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

    </div>

    <div>

        <!-- APPLE STYLE MARQUEE -->
        <div class="logo-wrapper">

            <div class="logo-track">

                <div class="logo-set">
                    <img class="small-logo" src="https://github.com/LikaLi1/About-Me/blob/main/docs/images/androidstudio.svg" alt="">
                    <img class="small-logo" src="https://github.com/LikaLi1/About-Me/blob/main/docs/images/behance.svg" alt="">
                    <img class="small-logo" src="https://github.com/LikaLi1/About-Me/blob/main/docs/images/cplusplus.svg" alt="">
                    <img class="small-logo" src="https://github.com/LikaLi1/About-Me/blob/main/docs/images/figma.svg" alt="">
                    <img class="small-logo" src="https://github.com/LikaLi1/About-Me/blob/main/docs/images/javascript.svg" alt="">
                </div>

                <div class="logo-set" aria-hidden="true">
                    <img class="small-logo" src="https://github.com/LikaLi1/About-Me/blob/main/docs/images/androidstudio.svg" alt="">
                    <img class="small-logo" src="https://github.com/LikaLi1/About-Me/blob/main/docs/images/behance.svg" alt="">
                    <img class="small-logo" src="https://github.com/LikaLi1/About-Me/blob/main/docs/images/cplusplus.svg" alt="">
                    <img class="small-logo" src="https://github.com/LikaLi1/About-Me/blob/main/docs/images/figma.svg" alt="">
                    <img class="small-logo" src="https://github.com/LikaLi1/About-Me/blob/main/docs/images/javascript.svg" alt="">
                </div>

            </div>
        </div>

    </div>
</div>

<button class="scroll-top" onclick="window.scrollTo({top:0, behavior:'smooth'})">
Top ↑
</button>

<div class="footer-pattern">
    © 2026 LikaLi1
</div>

</body>
</html>
